<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>李先良我操你妈</title>
    <link rel="stylesheet" href="style.css?v=20240812">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="发泄屋">
    <link rel="icon" href="icon.png" type="image/png">
</head>
<body>

    <div class="announcement-overlay" id="announcementOverlay">
        <div class="announcement-modal">
            <div class="announcement-icon">⚠️</div>
            <h2 class="announcement-title">重要公告</h2>
            <div class="announcement-content">
                <p>本页面包含两种模式，请根据需求选择：</p>
                <ul>
                    <li><strong>发泄模式</strong>：虚拟暴力模拟，含血腥效果</li>
                    <li><strong>道场模式</strong>：缅怀逝者，庄重追思</li>
                </ul>
                <p class="announcement-warning">现在可以获取源码，点右下角的开源就行了，死妈李先良。</p>
            </div>
            <button class="announcement-btn" id="announcementBtn">我知道了</button>
        </div>
    </div>

    <button class="mode-switch-btn" id="modeSwitchBtn" title="切换模式">
        <span id="modeSwitchIcon">🪦</span>
        <span id="modeSwitchText">道场模式</span>
    </button>

    <div class="main-container mode-venting" id="ventingMode">
        <div class="top-bar">
            <div class="stats">
                <span class="stat-item">🔪 攻击次数: <strong id="hitCount">0</strong></span>
                <span class="stat-item">💀 伤害值: <strong id="damageScore">0</strong></span>
            </div>
            <button class="install-btn" id="installBtn" title="添加到桌面">📱 添加到桌面</button>
        </div>

        <div class="character-area">
            <div class="character-container" id="characterContainer">
                <img src="2D.png" alt="人物" class="character-image" id="characterImage" draggable="false">
                <div class="wound-layer" id="woundLayer"></div>
                <div class="particle-layer" id="particleLayer"></div>
                <div class="click-hint" id="clickHint">选择道具后点击人物</div>
            </div>
        </div>

        <div class="weapon-bar">
            <div class="weapon-label">🔧 选择道具：</div>
            <div class="weapon-options">
                <button class="weapon-btn active" data-weapon="fist">👊 拳头</button>
                <button class="weapon-btn" data-weapon="knife">🔪 刀</button>
                <button class="weapon-btn" data-weapon="gun">🔫 枪</button>
                <button class="weapon-btn" data-weapon="chainsaw">🪚 电锯</button>
                <button class="weapon-btn" data-weapon="bat">🏏 棒球棍</button>
                <button class="weapon-btn" data-weapon="hammer">🔨 锤子</button>
            </div>
        </div>

        <a href="https://github.com/n514nmgz/1/tree/main" target="_blank" class="donate-btn">🌟 开源</a>
    </div>

    <div class="main-container mode-taoist" id="taoistMode" style="display: none;">
        <div class="paper-money-layer" id="paperMoneyLayer"></div>

        <div class="taoist-header">
            <div class="horizontal-banner">當 大 事</div>
        </div>

        <div class="taoist-main">
            <div class="couplet left-couplet">
                <p>流</p><p>水</p><p>夕</p><p>陽</p><p>千</p><p>古</p><p>恨</p>
            </div>

            <div class="memorial-center">
                <div class="portrait-frame" id="portraitFrame">
                    <img src="" alt="" class="portrait-image" id="portraitImage">
                    <div class="portrait-placeholder">
                        <span class="placeholder-icon">📷</span>
                        <span class="placeholder-text">点击上传遗照</span>
                    </div>
                    <input type="file" id="portraitUpload" accept="image/*" style="display: none;">
                </div>

                <div class="spirit-tablet">
                    <div class="tablet-content">
                        <div class="tablet-title">顯考</div>
                        <div class="tablet-name" id="tabletName" contenteditable="true">先考 某某某 之靈位</div>
                    </div>
                </div>

                <div class="date-section">
                    <div class="date-item">
                        <span class="date-label">生於</span>
                        <span class="date-value" id="birthDate" contenteditable="true">一九六零年正月初一</span>
                    </div>
                    <div class="date-item">
                        <span class="date-label">逝於</span>
                        <span class="date-value" id="deathDate" contenteditable="true">二零二四年臘月三十</span>
                    </div>
                </div>

                <div class="ritual-items">
                    <div class="candle left-candle">🕯️</div>
                    <div class="incense-burner">🪔</div>
                    <div class="candle right-candle">🕯️</div>
                </div>
            </div>

            <div class="couplet right-couplet">
                <p>淒</p><p>風</p><p>苦</p><p>雨</p><p>百</p><p>年</p><p>愁</p>
            </div>
        </div>

        <div class="taoist-footer">
            <div class="ceremony-text">道場法事 · 功德圓滿</div>
        </div>
    </div>

    <audio id="bgMusicVenting" loop preload="auto" src="audio.mp3"></audio>
    <audio id="bgMusicTaoist" loop preload="auto" src="taoist.mp3"></audio>

    <div class="screen-shake" id="screenShake"></div>

    <script src="script.js?v=20240812"></script>
</body>
</html>
